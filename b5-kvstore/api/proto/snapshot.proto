syntax = "proto3";

package snapshot;

option go_package = "b5-kvstore/pkg/pb";

import "google/protobuf/empty.proto";
import "consensus.proto";

// SnapshotTransfer is called by the Snapshot & Backup service against the
// current leader (GetLogStatus/ConfirmCompaction) or any node
// (StreamLogRange, since entries served there are already committed).
// See spec §9.4.
service SnapshotTransfer {
  rpc GetLogStatus(google.protobuf.Empty) returns (LogStatusReply);
  rpc StreamLogRange(LogRangeRequest) returns (stream consensus.LogEntry);
  rpc ConfirmCompaction(CompactionAck) returns (google.protobuf.Empty);
}

message LogStatusReply {
  uint64 total_entries = 1;
  uint64 occupancy_percent = 2;
  uint64 first_index = 3;
  uint64 last_index = 4;
}

message LogRangeRequest {
  uint64 from_index = 1;
  uint64 to_index = 2;
}

message CompactionAck {
  uint64 truncated_up_to_index = 1;
  bytes state_machine_snapshot = 2;
}

// SnapshotCatalog is queried by any consensus node (leader, follower, or a
// brand-new node) to independently discover and fetch the latest stable
// snapshot, per the periodic catch-up rule in §5.3.
service SnapshotCatalog {
  rpc GetLatestSnapshotInfo(google.protobuf.Empty) returns (SnapshotInfo);
  rpc FetchSnapshot(google.protobuf.Empty) returns (stream SnapshotChunk);
}

message SnapshotInfo {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  bool available = 3;
}

message SnapshotChunk {
  bytes data = 1; // chunked state-machine + log-anchor payload
  bool is_last = 2;
}
