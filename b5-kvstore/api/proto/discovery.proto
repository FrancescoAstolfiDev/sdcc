syntax = "proto3";

package discovery;

option go_package = "b5-kvstore/pkg/pb";

import "google/protobuf/empty.proto";
import "consensus.proto";

// Discovery is queried by the Client Proxy and the Snapshot & Backup
// service to resolve the current leader and cluster membership. It is
// never on the KV data path. See spec §9.3.
service Discovery {
  rpc GetClusterView(google.protobuf.Empty) returns (ClusterView);
}

message NodeInfo {
  string node_id = 1;
  string address = 2;
  consensus.Role role = 3;
  uint64 term = 4;
}

message ClusterView {
  string leader_address = 1;
  repeated NodeInfo followers = 2;
  repeated NodeInfo all_nodes = 3;
}
